<!doctype html>
<!-- Trang ẩn (không có link nào trỏ tới): gõ tên khách, lấy link mời riêng. Không cần sửa code hay deploy lại. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tạo link mời</title>
<style>
  @font-face { font-family: 'Be Vietnam Pro'; src: url('fonts/be-vietnam-pro-regular.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Be Vietnam Pro'; src: url('fonts/be-vietnam-pro-medium.woff2') format('woff2'); font-weight: 500; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px 16px; background: #eee5d4; color: #2A1D15; font: 16px/1.6 'Be Vietnam Pro', Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: #6A5545; font-size: 14px; }
  label { display: block; font-weight: 500; margin-bottom: 6px; }
  input { width: 100%; padding: 12px; font: inherit; border: 1px solid #b8a68c; border-radius: 6px; background: #fffaf0; color: inherit; }
  input:focus { outline: 2px solid #5A2E1B; outline-offset: 1px; }
  .link { margin-top: 20px; padding: 12px; border: 1px dashed #b8a68c; border-radius: 6px; background: #fffaf0; word-break: break-all; font-size: 14px; min-height: 48px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  button, a.btn { padding: 10px 16px; font: 500 14px 'Be Vietnam Pro', Arial, sans-serif; border: 1px solid #2A1D15; border-radius: 6px; background: #2A1D15; color: #fffaf0; cursor: pointer; text-decoration: none; }
  button.ghost, a.btn { background: transparent; color: #2A1D15; }
  button:disabled { opacity: .4; cursor: default; }
  h2 { font-size: 16px; font-weight: 500; margin: 36px 0 8px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 0; border-top: 1px solid #d7c9b2; font-size: 14px; }
  li button { padding: 6px 10px; font-size: 13px; }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
</style>
</head>
<body>
<main>
  <h1>Tạo link mời</h1>
  <p>Gõ tên đúng như muốn hiện trên thiệp, ví dụ "Anh Hoàng &amp; Chị Lan", rồi sao chép link gửi cho khách.</p>

  <label for="name">Tên khách</label>
  <input id="name" maxlength="80" autocomplete="off" placeholder="Anh Hoàng &amp; Chị Lan">

  <div class="link" id="link" aria-live="polite"></div>
  <div class="row">
    <button type="button" id="copy" disabled>Sao chép link</button>
    <a class="btn" id="open" target="_blank" rel="noopener" hidden>Xem thử thiệp</a>
  </div>

  <h2>Đã tạo trên máy này</h2>
  <ul id="history"></ul>
</main>
<script src="js/guest-name.js"></script>
<script>
(function () {
  var input = document.getElementById('name'), out = document.getElementById('link');
  var copy = document.getElementById('copy'), open = document.getElementById('open'), list = document.getElementById('history');
  var base = new URL('./', location.href).href;
  var saved = [];
  try { saved = JSON.parse(localStorage.getItem('invite-links') || '[]'); } catch (e) {}

  // Cùng bộ mã hoá (js/guest-name.js) mà thiệp dùng để đọc tên.
  function linkFor(name) { return base + '?' + GuestName.encode(name); }
  function copyText(text, button) {
    function done(label) { var old = button.textContent; button.textContent = label; setTimeout(function () { button.textContent = old; }, 1500); }
    navigator.clipboard.writeText(text).then(function () { done('Đã chép'); }, function () {
      var r = document.createRange(); r.selectNodeContents(out);
      var s = getSelection(); s.removeAllRanges(); s.addRange(r); done('Đã chọn, nhấn Ctrl+C');
    });
  }
  function store() {
    try { localStorage.setItem('invite-links', JSON.stringify(saved)); } catch (e) {}
    renderHistory();
  }
  function remember(name, link) {
    saved = saved.filter(function (item) { return item.name !== name; });
    saved.unshift({ name: name, link: link });
    saved = saved.slice(0, 100);
    store();
  }
  function button(label, onclick) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'ghost'; b.textContent = label; b.onclick = function () { onclick(b); };
    return b;
  }
  function renderHistory() {
    list.replaceChildren();
    saved.forEach(function (item) {
      var li = document.createElement('li'), span = document.createElement('span'), actions = document.createElement('span');
      span.textContent = item.name;
      actions.className = 'actions';
      actions.append(
        button('Chép link', function (b) { copyText(item.link, b); }),
        // Chỉ xoá khỏi lịch sử trên máy này; link đã gửi vẫn mở được.
        button('Xoá', function () { saved = saved.filter(function (other) { return other !== item; }); store(); })
      );
      li.append(span, actions); list.append(li);
    });
    if (!saved.length) { var li = document.createElement('li'); li.textContent = 'Chưa có.'; list.append(li); }
  }
  function update() {
    var name = input.value.trim();
    out.textContent = name ? linkFor(name) : '';
    copy.disabled = !name;
    open.hidden = !name;
    if (name) open.href = out.textContent;
  }
  input.addEventListener('input', update);
  copy.addEventListener('click', function () {
    var name = input.value.trim(); if (!name) return;
    copyText(out.textContent, copy); remember(name, out.textContent);
  });
  renderHistory();
  update();
  input.focus();
})();
</script>
</body>
</html>
